# Resolver de Docker para balancear entre réplicas del API
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Cliente PWA (raíz)
    root /usr/share/nginx/html;
    index index.html;

    # Panel staff (subruta /staff/)
    location /staff/ {
        alias /usr/share/nginx/html/staff/;
        try_files $uri $uri/ /staff/index.html;
    }

    # API REST (balanceo entre réplicas del servicio "api")
    location /api/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (Socket.IO)
    location /socket.io/ {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Archivos subidos (fotos de productos, logos)
    location /uploads/ {
        set $api http://api:3000;
        proxy_pass $api;
    }

    # SPA cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
