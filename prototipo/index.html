<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KLUBB — Prototipo completo</title>
<style>
  :root{
    --bg:#0d0f12; --panel:#16191f; --panel2:#1d222b; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#8b93a3; --accent:#f5b301; --accent2:#e09a00;
    --ok:#2ecc71; --warn:#e67e22; --bad:#e74c3c; --info:#3498db; --purple:#9b59b6;
    --radius:14px; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:9px}
  input,select,textarea{font-family:inherit; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)}
  label{font-size:12px; color:var(--muted); display:block; margin:10px 0 4px}

  .app{display:grid; grid-template-rows:56px 1fr; height:100vh}
  header{display:flex; align-items:center; gap:16px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line)}
  .logo{font-weight:800; letter-spacing:.5px; font-size:18px}
  .logo span{color:var(--accent)}
  .role-switch{margin-left:auto; display:flex; align-items:center; gap:8px}
  .role-switch select{min-width:210px; width:auto}

  .layout{display:grid; grid-template-columns:230px 1fr; overflow:hidden}
  nav{background:var(--panel); border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:4px; overflow-y:auto}
  nav button{text-align:left; background:transparent; color:var(--muted); padding:10px 12px; font-size:14px; display:flex; gap:10px; align-items:center; border-radius:9px; transition:.15s; width:100%}
  nav button:hover{color:var(--text); background:var(--panel2)}
  nav button.active{color:var(--accent); background:var(--panel2)}

  main{padding:22px; overflow-y:auto; position:relative}
  .screen{display:none}
  .screen.on{display:block; animation:fade .25s}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

  h1{font-size:20px; margin-bottom:4px}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px}
  .grid{display:grid; gap:14px}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  .cols-4{grid-template-columns:repeat(4,1fr)}
  .cols-2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
  .card h3{font-size:14px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between}
  .stat{font-size:26px; font-weight:700}
  .stat small{font-size:12px; color:var(--muted); font-weight:400; display:block; margin-top:4px}

  .pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap}
  .pill.ok{background:rgba(46,204,113,.15); color:var(--ok)}
  .pill.warn{background:rgba(230,126,34,.15); color:var(--warn)}
  .pill.bad{background:rgba(231,76,60,.15); color:var(--bad)}
  .pill.info{background:rgba(52,152,219,.15); color:var(--info)}
  .pill.mute{background:var(--panel2); color:var(--muted)}
  .pill.purple{background:rgba(155,89,182,.15); color:var(--purple)}

  .btn{background:var(--panel2); color:var(--text); padding:9px 14px; font-weight:600; border:1px solid var(--line)}
  .btn.primary{background:var(--accent); color:#15120a; border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent2)}
  .btn.danger{background:var(--bad); color:#fff}
  .btn.sm{padding:6px 10px; font-size:12px}
  .btn.block{width:100%}
  .btn.ghost{background:transparent}

  .table-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px}
  .mesa{border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; cursor:pointer; background:var(--panel); transition:.15s}
  .mesa:hover{border-color:var(--accent)}
  .mesa .num{font-size:20px; font-weight:800}
  .mesa .zona{font-size:10px; color:var(--muted); margin-top:2px}
  .mesa .estado{margin-top:6px}
  .mesa.libre{border-top:3px solid var(--ok)}
  .mesa.ocupada{border-top:3px solid var(--warn)}
  .mesa.pidiendo{border-top:3px solid var(--info)}

  .list-item{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-bottom:10px}
  .list-item .body{flex:1; min-width:0}
  .list-item .title{font-weight:600}
  .list-item .meta{font-size:12px; color:var(--muted); margin-top:3px}

  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .spread{justify-content:space-between}
  .qty{display:flex; align-items:center; gap:8px}
  .qty button{width:26px; height:26px; background:var(--panel2); color:var(--text); font-weight:700; border:1px solid var(--line)}
  .bar{height:6px; border-radius:99px; background:var(--panel2); overflow:hidden}
  .bar > div{height:100%; background:var(--accent)}
  .bar.green > div{background:var(--ok)}
  .bar.purple > div{background:var(--purple)}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50}
  .modal-bg.on{display:flex}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; width:440px; max-width:92vw; max-height:90vh; overflow-y:auto}
  .modal h2{font-size:17px; margin-bottom:14px}
  .qr{background:#fff; padding:14px; border-radius:12px; text-align:center; width:180px; margin:12px auto}
  .qr .mock{font-family:monospace; font-size:11px; color:#111; line-height:1.15; word-break:break-all}
  .qr .url{font-size:10px; color:#555; margin-top:6px}

  .toast-wrap{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:10px; z-index:100}
  .toast{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--accent); padding:12px 16px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; animation:slide .25s; max-width:320px}
  .toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.info{border-left-color:var(--info)}
  @keyframes slide{from{opacity:0; transform:translateX(20px)}to{opacity:1; transform:none}}

  /* Login */
  .login-wrap{max-width:400px; margin:40px auto; text-align:center}
  .login-brand{font-size:40px; font-weight:800; letter-spacing:1px}
  .login-brand span{color:var(--accent)}
  .login-card{text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; margin-top:18px}

  /* Cliente (PWA) */
  .phone{max-width:410px; margin:0 auto; background:#0a0c10; border:1px solid var(--line); border-radius:26px; overflow:hidden; min-height:640px; display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .c-hero{position:relative; padding:18px 16px 14px; background:radial-gradient(130% 120% at 20% -10%, #3a2a06 0%, #141821 55%, #0d0f12 100%); border-bottom:1px solid var(--line); overflow:hidden}
  .c-hero::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(245,179,1,.16), transparent 62%); pointer-events:none}
  .c-top{display:flex; align-items:center; gap:11px; position:relative; z-index:1}
  .c-avatar{width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--accent),#7a5b00); display:flex; align-items:center; justify-content:center; font-weight:800; color:#15120a; flex-shrink:0; font-size:15px}
  .c-title{font-weight:800; font-size:16px}
  .c-subtitle{font-size:11px; color:var(--muted)}
  .c-pts{font-size:11px; color:var(--accent); font-weight:700}
  .c-search{position:relative; z-index:1; margin-top:12px}
  .c-search input{background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:12px; padding:10px 12px 10px 34px}
  .c-search span{position:absolute; left:11px; top:9px; opacity:.55}

  .c-body{flex:1; overflow-y:auto; padding:14px 14px 4px}
  .c-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none}
  .c-chips::-webkit-scrollbar{display:none}
  .c-chip{display:flex; flex-direction:column; align-items:center; gap:4px; background:transparent; color:var(--muted); padding:8px 12px; font-size:11px; border-radius:13px; min-width:66px; flex-shrink:0}
  .c-chip .ico{font-size:21px}
  .c-chip.on{background:rgba(245,179,1,.13); color:var(--accent)}

  .c-card{display:flex; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px; margin-bottom:10px; align-items:center; cursor:pointer}
  .c-card:hover{border-color:var(--accent)}
  .c-img{width:58px; height:58px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:27px; flex-shrink:0; background:linear-gradient(135deg,#262c37,#16191f)}
  .c-info{flex:1; min-width:0}
  .c-name{font-weight:700; font-size:14px}
  .c-desc{font-size:11px; color:var(--muted); margin:2px 0}
  .c-price{font-weight:700; color:var(--accent); font-size:14px}
  .add-btn{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#15120a; font-weight:800; font-size:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:.12s}
  .add-btn:active{transform:scale(.85)}

  .c-section{font-weight:700; font-size:13px; margin:16px 0 10px; display:flex; align-items:center; gap:6px}
  .hscroll{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .mini{min-width:150px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; flex-shrink:0}
  .mini .c-img{width:44px;height:44px;font-size:20px}

  .c-tabbar{display:flex; border-top:1px solid var(--line); background:var(--panel); flex-shrink:0}
  .c-tab{flex:1; text-align:center; padding:9px 4px 11px; background:transparent; color:var(--muted); font-size:10px; border-radius:0; position:relative}
  .c-tab .ico{font-size:19px; display:block; margin-bottom:2px}
  .c-tab.on{color:var(--accent)}
  .c-tab .dot{position:absolute; top:8px; right:calc(50% - 16px); width:8px; height:8px; border-radius:50%; background:var(--accent)}

  .banner{margin-bottom:12px; border-radius:16px; padding:16px; background:linear-gradient(120deg, rgba(245,179,1,.18), rgba(155,89,182,.12)); border:1px solid var(--line)}
  .banner b{color:var(--accent)}
  .banner.flash{border-color:var(--accent); animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,179,1,.4)}50%{box-shadow:0 0 0 8px rgba(245,179,1,0)}}
  .float-account{margin:0 -14px -4px; padding:10px 14px; background:linear-gradient(180deg, transparent, #0a0c10 30%)}
  .float-account .inner{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:12px; justify-content:space-between}
  .order-tag{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); padding:6px 0}

  /* KDS */
  .kds-bar{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:14px}
  .kds-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-items:start}
  .kds-col{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; min-height:220px}
  .kds-col h3{font-size:13px; display:flex; align-items:center; gap:8px; margin-bottom:12px}
  .kds-col .dotc{width:10px;height:10px;border-radius:50%}
  .kds-card{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--panel2)}
  .kds-card.r{border-left:4px solid var(--bad)}
  .kds-card.p{border-left:4px solid var(--warn)}
  .kds-card.l{border-left:4px solid var(--ok)}
  .kds-code{font-weight:800; color:var(--accent); font-size:14px}
  .kds-meta{font-size:11px; color:var(--muted); margin:2px 0}
  .kds-items{font-size:13px; margin:6px 0}
  .pin{font-family:monospace; letter-spacing:6px; font-size:20px; font-weight:700; text-align:center; padding:8px; background:var(--panel2); border-radius:8px; margin:8px 0}

  /* Paginación */
  .pager{display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-top:12px}
  .pager button{background:var(--panel2); border:1px solid var(--line); color:var(--muted); padding:6px 10px; font-size:12px}
  .pager button.on{background:var(--accent); color:#15120a; border-color:var(--accent)}
</style>
</head>

const currency = n => "$" + n.toLocaleString("es-CO");
const margin = p => Math.round((p.precio - p.costo) / p.precio * 100);

function toast(msg, type){
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + (type||"");
  t.textContent = msg;
  w.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function openModal(html){
  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalBg").classList.add("on");
}
function closeModal(){
  document.getElementById("modalBg").classList.remove("on");
  document.getElementById("modalBody").innerHTML = "";
}
document.getElementById("modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") closeModal(); });

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = ROLES[role].screens.map(s =>
    `<button data-s="${s}" class="${s===screen?'active':''}">${NAV_LABEL[s]}</button>`
  ).join("");
  nav.querySelectorAll("button").forEach(b=> b.onclick=()=>{ screen=b.dataset.s; render(); });
}

function renderRoleSel(){
  const sel = document.getElementById("roleSel");
  sel.innerHTML = Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.short}</option>`).join("");
  sel.value = role;
  sel.onchange = ()=>{ role = sel.value; screen = ROLES[role].screens[0]; render(); };
}

function render(){
  if(!loggedIn){
    document.getElementById("roleSel").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("nav").innerHTML = "";
    document.getElementById("main").innerHTML = loginScreen();
    document.getElementById("headerLogo").innerHTML = state.config.logo + `<span>B</span>`;
    return;
  }
  document.getElementById("roleSel").style.display = "";
  document.getElementById("logoutBtn").style.display = "";
  document.getElementById("headerLogo").innerHTML = state.config.logo + `<span>B</span>`;
  renderNav(); renderRoleSel();
  const main = document.getElementById("main");
  const f = SCREENS[screen];
  main.innerHTML = f ? f() : "<h1>Sin contenido</h1>";
}

/* ===== Helpers / acciones ===== */
function countInCart(pid){ const c = state.carrito.find(i=>i.pid===pid); return c?c.q:0; }
function carritoSubtotal(){
  return state.carrito.reduce((s,i)=> s + state.productos.find(x=>x.id===i.pid).precio*i.q, 0);
}
function cuentaTotal(){
  const cuenta = state.miCuenta.reduce((s,i)=>s + i.precio*i.q, 0);
  return cuenta + carritoSubtotal();
}
function accountItems(){
  if(!state.miCuenta.length && !state.carrito.length) return `<div class="meta">Aún no has pedido nada.</div>`;
  let html = "";
  state.miCuenta.forEach(i=>{
    const pill = i.estado==="servido"?"ok":i.estado==="en_preparacion"?"warn":"info";
    html += `<div class="list-item" style="padding:8px"><div class="body"><div class="title" style="font-size:13px">${i.q}x ${i.p}</div></div><span class="pill ${pill}" style="font-size:10px">${i.estado.replace('_',' ')}</span><span class="meta">${currency(i.precio*i.q)}</span></div>`;
  });
  state.carrito.forEach(i=>{
    const p = state.productos.find(x=>x.id===i.pid);
    html += `<div class="list-item" style="padding:8px"><div class="body"><div class="title" style="font-size:13px">${i.q}x ${p.nombre}</div></div><span class="pill mute" style="font-size:10px">por enviar</span><span class="meta">${currency(p.precio*i.q)}</span></div>`;

  return html;
}

function addCart(pid, d){
  const p = state.productos.find(x=>x.id===pid);
  let c = state.carrito.find(i=>i.pid===pid);
  if(!c){ c={pid, q:0}; state.carrito.push(c); }
  c.q += d;
  if(c.q<=0) state.carrito = state.carrito.filter(i=>i.pid!==pid);
  render();
}

  const sub = carritoSubtotal();
  const prop = Math.round(sub * state.propina/100);
  const total = sub + prop;
  openModal(`<h2>Confirmar pedido</h2>
    <div class="meta" style="color:var(--muted);margin-bottom:8px">Mesa ${state.miMesa} · código se generará al pagar</div>

function confirmarPedido(){
  const sub = carritoSubtotal();
  const prop = Math.round(sub * state.propina/100);
  const items = state.carrito.map(i=>{const p=state.productos.find(x=>x.id===i.pid); return {p:p.nombre,q:i.q};});
  const codigo = "#B-0" + state.nextCodigo;
  const pin = Math.floor(1000 + Math.random()*9000);
  const zona = state.mesas.find(m=>m.id===state.miMesa)?.zona || "Pista";
  state.pedidos.push({id:200+state.nextCodigo, codigo, mesa:state.miMesa, zona, items, estado:"recibido", mesero:"Laura", total:sub+prop, modo:state.modoEntrega, min:0, pin});
  state.nextCodigo++;
  state.carrito = [];
  closeModal(); render();
  openModal(`<h2>✅ Pago confirmado</h2>
    <p style="color:var(--muted);font-size:13px">Tu comanda fue enviada a la barra en tiempo real.</p>
    <div class="pin">${codigo}</div>
    <div class="meta" style="text-align:center">PIN de entrega: <b style="letter-spacing:3px">${pin}</b></div>
    <br><button class="btn primary block" onclick="closeModal()">Listo</button>`);
  toast("Comanda "+codigo+" enviada a barra 🍸", "ok");
}

function abrirRegistro(){
  openModal(`<h2>Tu cuenta KLUBB</h2>
    <p style="color:var(--muted);font-size:13px">Registrarte te permite acumular puntos y ver tu historial. También puedes seguir como invitado.</p>
    <div class="row" style="justify-content:center">
      <button id="tabLogin" onclick="swapRegistro('login')">Iniciar sesión</button>
      <button id="tabReg" class="primary" onclick="swapRegistro('registro')">Registrarme</button>
    </div>
    <div id="regForm"></div>
    <br><button class="btn block" onclick="closeModal(); toast('Continuando como invitado')">Continuar como invitado</button>`);
  swapRegistro('registro');
}
function swapRegistro(mode){
  const el = document.getElementById("regForm");
  if(!el) return;
  document.getElementById("tabLogin").className = "btn" + (mode==="login"?" primary":"");
  document.getElementById("tabReg").className = "btn" + (mode==="registro"?" primary":"");
  el.innerHTML = mode==="login"
    ? `<label>Email o celular</label><input placeholder="correo@ejemplo.com" /><label>Contraseña</label><input type="password" placeholder="••••••" /><br><br><button class="btn primary block" onclick="doLogin()">Entrar</button>`
    : `<label>Nombre</label><input id="regNombre" placeholder="Tu nombre" /><label>Email o celular</label><input placeholder="correo@ejemplo.com" /><label>Contraseña</label><input type="password" placeholder="••••••" /><br><br><button class="btn primary block" onclick="doRegister()">Crear cuenta</button>`;
}
function doLogin(){ state.registrado=true; state.usuario.nombre="Cliente"; closeModal(); render(); toast("Bienvenido de nuevo 👋","ok"); }
function doRegister(){
  const n = document.getElementById("regNombre")?.value || "Cliente";
  state.registrado=true; state.usuario.nombre=n; state.usuario.puntos += 200;
  closeModal(); render(); toast("Cuenta creada · +200 pts de bienvenida 🎉","ok");
}
function pagarCuenta(){ checkout(); }

function solicitar(tipo){
  state.solicitudes.push({id:Date.now(), mesa:state.miMesa, tipo, tiempo:"ahora"});
  toast(tipo+" enviado al mesero 📣");
}
function atenderSolicitud(id){
  state.solicitudes = state.solicitudes.filter(s=>s.id!==id);
  render(); toast("Solicitud atendida ✓","ok");
}

function votar(id){
  if(state.votados.includes(id)) return;
  state.votados.push(id);
  state.canciones.find(x=>x.id===id).votos++;
  render();
  toast("Voto registrado 🎵", "ok");
}
function dividirCuenta(){
  const total = cuentaTotal() || 62000;
  openModal(`<h2>Dividir cuenta — Mesa ${state.miMesa}</h2>
    <p style="color:var(--muted);font-size:13px">Total: ${currency(total)}</p>
    <label>¿Cuántas personas?</label><select id="divN">${[2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select>
    <br><br><div id="divRes"></div>
    <button class="btn primary block" onclick="calcDiv()">Calcular</button>
    <br><br><button class="btn block" onclick="closeModal(); toast('Pago dividido enviado','ok')">Confirmar división</button>`);
  setTimeout(calcDiv, 50);
}
function calcDiv(){
  const n = parseInt(document.getElementById("divN")?.value || 2);
  const total = cuentaTotal() || 62000;
  document.getElementById("divRes").innerHTML = `${n} personas · ${currency(Math.round(total/n))} c/u`;
}

function crearZona(){ openModal(`<h2>Nueva zona</h2><label>Nombre</label><input placeholder="Ej: VIP Nivel 2" /><br><br><button class="btn primary block" onclick="closeModal(); toast('Zona creada')">Crear zona</button>`); }
function crearMesa(){
  const id = state.mesas.length+1;
  const qr = "KLB-m"+id;
  state.mesas.push({id, zona:state.zonas[0], estado:"libre", mesero:"", qr});
  render();
  openModal(`<h2>Mesa ${id} creada</h2>
    <p style="color:var(--muted); font-size:13px">Imprime este QR y pégalo en la mesa. Es único.</p>
    <div class="qr"><div class="mock">${mockQR(qr)}</div><div class="url">klubb.app/m/${qr}</div></div>
    <label>Zona</label><select>${state.zonas.map(z=>`<option>${z}</option>`).join("")}</select>
    <label>Asignar mesero</label><select><option>Laura</option><option>Carlos</option><option>Sin asignar</option></select>
    <br><br><button class="btn primary block" onclick="closeModal(); toast('Mesa ${id} guardada y QR listo')">Descargar / Guardar</button>`);
}
function verMesa(id){
  const m = state.mesas.find(x=>x.id===id);
  openModal(`<h2>Mesa ${m.id}</h2>
    <div class="row"><span class="pill ${m.estado==='libre'?'ok':'warn'}">${m.estado}</span></div>
    <label>Zona</label><select>${state.zonas.map(z=>`<option ${z===m.zona?'selected':''}>${z}</option>`).join("")}</select>
    <label>Estado</label><select><option>Libre</option><option>Ocupada</option><option>Pidiendo</option></select>
    <label>Mesero asignado</label><select><option>Laura</option><option>Carlos</option><option>Sin asignar</option></select>
    <br><br><div class="qr"><div class="mock">${mockQR(m.qr)}</div><div class="url">klubb.app/m/${m.qr}</div></div>
    <button class="btn block" onclick="closeModal(); toast('Mesa actualizada')">Guardar cambios</button>`);
}
function crearProducto(){
  openModal(`<h2>Nuevo producto</h2>
    <label>Categoría</label><select>${state.categorias.map(c=>`<option>${c}</option>`).join("")}</select>
    <label>Nombre</label><input placeholder="Ej: Margarita" />
    <div class="grid cols-2">
      <div><label>Precio venta</label><input placeholder="25000" /></div>
      <div><label>Costo</label><input placeholder="7000" /></div>
    </div>
    <label>Stock inicial</label><input placeholder="20" />
    <label>Stock mínimo (alerta)</label><input placeholder="5" />
    <br><br><button class="btn primary block" onclick="closeModal(); toast('Producto creado')">Crear</button>`);
}
function crearUsuario(){
  openModal(`<h2>Nuevo usuario</h2>
    <label>Nombre completo</label><input placeholder="Nombre" />
    <label>Correo</label><input placeholder="correo@bar.com" />
    <label>Rol</label><select><option>Administrador</option><option>Cajero</option><option>Bartender</option><option>Mesero</option><option>DJ</option></select>
    <label>Estado</label><select><option>Activo</option><option>Inactivo</option></select>
    <br><br><button class="btn primary block" onclick="closeModal(); toast('Usuario creado')">Crear usuario</button>`);
}
function guardarConfig(){
  state.config.logo = document.getElementById("cfgLogo")?.value || state.config.logo;
  state.config.barName = document.getElementById("cfgName")?.value || state.config.barName;
  state.config.bienvenida = document.getElementById("cfgMsg")?.value || state.config.bienvenida;
  render(); toast("Configuración guardada y aplicada al instante", "ok");
}

function pausarStock(id){
  const p = state.productos.find(x=>x.id===id);
  p.stock = p.stock===0 ? p.min : 0;
  render(); toast(p.nombre + (p.stock===0?" pausado (agotado)":" reactivado"));
}
function pausaStockBarra(){
  openModal(`<h2>⏸️ Pausar producto agotado</h2>
    <p style="color:var(--muted);font-size:13px">El producto desaparece al instante de la carta del cliente.</p>
    ${state.productos.map(p=>`<div class="list-item" style="padding:8px"><div class="body"><div class="title" style="font-size:13px">${p.emoji} ${p.nombre}</div></div><span class="pill ${p.stock===0?'bad':'ok'}">${p.stock===0?'Agotado':'Activo'}</span><button class="btn sm" onclick="pausarStock(${p.id});pausaStockBarra()">${p.stock===0?'Activar':'Pausar'}</button></div>`).join("")}
    <br><button class="btn block" onclick="closeModal()">Cerrar</button>`);
}
function lanzarPromo(){
  openModal(`<h2>⚡ Promo Relámpago</h2>
    <label>Texto de la promo</label><input id="promoTxt" placeholder="Ej: 2x1 en Margaritas por 30 min" />
    <br><br><button class="btn primary block" onclick="doLanzarPromo()">Lanzar promo a todos los clientes</button>`);
}
function doLanzarPromo(){
  const t = document.getElementById("promoTxt")?.value || "2x1 en Margaritas";
  state.promosRelampago.push(t);
  closeModal(); render();
  toast("Promo lanzada: banner flotante en la app de clientes ⚡", "ok");
}

function preparar(id){ const p=state.pedidos.find(x=>x.id===id); p.estado="en_preparacion"; render(); toast(p.codigo+" en preparación"); }
function marcarListo(id){
  const p=state.pedidos.find(x=>x.id===id); p.estado="listo"; render();
  if(p.modo==="mesa") toast("¡Listo! Notificando a "+p.mesero+" (mesero asignado) 🔔", "ok");
  else toast("¡Listo! Notificando al cliente para retiro en barra 📱", "ok");
}
function confirmarEntrega(id){
  const p=state.pedidos.find(x=>x.id===id);
  openModal(`<h2>Confirmar entrega</h2>
    <div class="meta" style="text-align:center">Comanda ${p.codigo} · Mesa ${p.mesa}</div>
    <div class="pin">PIN ${p.pin}</div>
    <p style="color:var(--muted);font-size:13px">Solicita al cliente/mesero el PIN o escanea el QR de la comanda.</p>
    <button class="btn primary block" onclick="entregar(${p.id})">✅ Confirmar entregado (PIN válido)</button>`);
}
function entregar(id){ const p=state.pedidos.find(x=>x.id===id); p.estado="entregado"; closeModal(); render(); toast(p.codigo+" entregado"); }
function registrarPago(){
  state.pagos.push({id:504, mesero:"Laura", mesa:2, metodo:"Efectivo", total:32000, productos:"4x Club Colombia", hora:"23:00"});
  render(); toast("Pago registrado", "ok");
}
function ponerCancion(id){ state.canciones.find(x=>x.id===id).estado="sonando"; render(); toast("Reproduciendo…"); }
function confCancion(id){ state.canciones.find(x=>x.id===id).estado="ya_puesta"; render(); toast("Confirmado al cliente"); }
function cerrarCaja(){ state.caja.turno="cerrado"; render(); toast("Cierre Z generado: reporte PDF/Excel listo", "ok"); }

function mockQR(code){
  return "■".repeat(6)+"\n"+Array.from(code).map(()=>"██ ██ █").join("\n")+"\n"+"■".repeat(6);
}

render();
</script>
</body>
</html>
